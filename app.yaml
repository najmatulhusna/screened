kind: wasmer.io/App.v0

# Ganti "najmatulhusna" dengan username Wasmer kamu kalau beda dari GitHub
owner: najmatulhusna
name: screened
package: .

env:
  APP_ENV: production
  APP_DEBUG: "false"
  # Ganti setelah deploy pertama, ambil URL dari dashboard Wasmer
  APP_URL: "https://screened.wasmer.app"
  DB_CONNECTION: mysql
  SESSION_DRIVER: cookie
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  LOG_CHANNEL: stderr

capabilities:
  database:
    engine: mysql

# Volume hanya tersedia di region tertentu, jadi app dipin ke fr-roub1
# (region default database Wasmer) supaya volume bisa dimount.
locality:
  regions:
    - fr-roub1

# Volume persisten untuk poster (muncul di tab Storage dashboard Wasmer).
# Mount langsung ke docroot supaya PHP built-in server menyajikan file
# sebagai file statis tanpa perlu symlink public/storage.
volumes:
  - name: posters
    mount: /app/public/storage

scaling:
  mode: single_concurrency
